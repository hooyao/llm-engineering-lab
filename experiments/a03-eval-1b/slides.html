<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fine-tuning isn't magic</title>
<style>
  :root{
    --bg:#0b1020; --panel:#0f1730; --ink:#e8eefc; --muted:#9fb0d6;
    --accent:#5eead4; --accent2:#fbbf24; --line:#24304f; --bad:#f87171;
    --code:#0a1226; --good:#4ade80;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,
      "Microsoft YaHei","PingFang SC",sans-serif;}
  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .slide{
    display:none; width:min(1180px,94vw); aspect-ratio:16/9; max-height:90vh;
    background:linear-gradient(160deg,#0f1730,#0b1020);
    border:1px solid var(--line); border-radius:18px;
    padding:46px 56px; overflow:hidden; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .slide.active{display:flex; flex-direction:column;}
  body.notes-on .slide{max-height:62vh;}
  .kicker{font-size:15px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:8px}
  .kicker .act{color:var(--accent2)}
  h1{font-size:46px;line-height:1.08;margin:.1em 0 .35em;font-weight:800;letter-spacing:-.01em}
  h2{font-size:34px;line-height:1.12;margin:.1em 0 .55em;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:21px;color:var(--muted);font-weight:500;line-height:1.4}
  ul{margin:.2em 0;padding-left:1.1em}
  li{font-size:21px;line-height:1.5;margin:.42em 0}
  li b,p b{color:#fff}
  .em{color:var(--accent)}
  .em2{color:var(--accent2)}
  .big{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;height:100%}
  .center .sub{max-width:80%}
  /* ---------- code / mono ---------- */
  pre{background:var(--code);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin:.5em 0;overflow:auto}
  code,pre,.mono{font-family:"JetBrains Mono",Consolas,"SF Mono",Menlo,monospace}
  pre{font-size:16.5px;line-height:1.5;color:#cfe3ff}
  .cmt{color:#6b81b3}
  .hl{color:var(--accent)} .hl2{color:var(--accent2)} .hlbad{color:var(--bad)}
  /* ---------- tables ---------- */
  table{border-collapse:collapse;width:100%;margin:.35em 0;font-size:19px}
  th,td{border:1px solid var(--line);padding:9px 13px;text-align:left}
  th{background:#16203c;color:var(--accent);font-weight:700;font-size:16px;
    letter-spacing:.03em;text-transform:uppercase}
  tbody tr:nth-child(even){background:#0e1630}
  td b{color:#fff}
  .rowhi{background:#13233f !important}
  /* ---------- two-column ---------- */
  .cols{display:flex;gap:34px;flex:1;min-height:0}
  .cols>div{flex:1;display:flex;flex-direction:column;justify-content:center}
  .card{background:#0e1730;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .ba{display:flex;gap:18px}
  .ba .col{flex:1;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .ba .col h4{margin:.1em 0 .5em;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
  .ba .before h4{color:var(--bad)} .ba .after h4{color:var(--accent)}
  .ba .col p{font-size:16px;line-height:1.45;color:#cdd9f5;margin:.3em 0}
  /* ---------- fill placeholder ---------- */
  .fill{background:repeating-linear-gradient(45deg,#3a2d05,#3a2d05 12px,#332803 12px,#332803 24px);
    border:2px dashed var(--accent2);border-radius:12px;color:#ffe9a8;
    padding:14px 18px;font-size:17px;font-weight:600}
  .fill b{color:#fff}
  /* ---------- callout ---------- */
  .note-line{margin-top:auto;font-size:18px;color:var(--muted);border-top:1px solid var(--line);
    padding-top:12px}
  .tag{display:inline-block;background:#16203c;border:1px solid var(--line);border-radius:999px;
    padding:3px 12px;font-size:14px;color:var(--accent);font-weight:700;
    letter-spacing:.05em;margin-bottom:6px}
  .pill-bad{color:var(--bad);border-color:#46233a;background:#1f1426}
  /* ---------- presenter notes ---------- */
  #notes{display:none;position:fixed;left:0;right:0;bottom:0;height:34vh;
    background:#070b18;border-top:2px solid var(--accent);
    padding:16px 30px 18px;overflow:auto;z-index:30}
  body.notes-on #notes{display:block}
  #notes h3{margin:0 0 8px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent2);font-weight:700}
  #notes .nbody{font-size:15.5px;line-height:1.55;color:#d6e1fb;max-width:1100px;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  #notes .nbody b{color:#fff}
  #notes .nbody .t{color:var(--accent)}
  #notes .nbody .say{color:#ffd98a}
  #notes .nbody .trans{color:#8fe3d4;font-style:italic}
  #notes .nbody code{background:#11193a;padding:1px 6px;border-radius:5px;color:#bfe;font-size:15px}
  /* ---------- chrome ---------- */
  #bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:40;transition:width .2s}
  #hud{position:fixed;right:16px;bottom:14px;font-size:13px;color:var(--muted);z-index:40;
    background:rgba(8,12,26,.7);border:1px solid var(--line);border-radius:8px;padding:5px 11px}
  body.notes-on #hud{bottom:calc(34vh + 12px)}
  #help{position:fixed;left:16px;bottom:14px;font-size:12.5px;color:#6b7ba6;z-index:40}
  body.notes-on #help{bottom:calc(34vh + 12px)}
  .muted{color:var(--muted)}
  .arrow{color:var(--accent2);font-weight:800}
</style>
</head>

<div id="bar"></div>

<div id="notes"><h3>讲稿 / Presenter notes &nbsp;·&nbsp; <span class="muted">N 隐藏 · 按 P 移到独立窗口</span></h3><div class="nbody" id="nbody"></div></div>

<script>
/* ============================================================
   Each slide: { body: <english HTML for the screen>,
                 notes: <chinese HTML for the speaker> }
   Slide text = English (for the audience). Notes = 中文 (for you).
   ============================================================ */
const slides = [

/* 0 — HOOK / TITLE */
{
body:`<div class="center">
  <div class="kicker">Team share · 30 min</div>
  <h1>Fine-tuning isn't magic</h1>
  <div class="sub">A finished model + your data → nudge its behavior.<br>
  Same process as pretraining — just less of it.</div>
</div>`,
notes:`<b>开场 · 定位听众</b><br>
▸ 在座各位都是用模型的高手——prompt、RAG、agent,你们玩得都比我熟,所以这些今天我一概不讲。<br>
▸ 我们平时都是站在 API 外面用模型;今天我想带大家往下走一层,到自己的机器上,直接去改模型的 weight。<br>
▸ 其实 fine-tuning 一点都不神秘:它和 pretraining 是同一回事,都是预测下一个 token、再回头调 weight,唯一的区别就是用的数据少得多。<br>
▸ 今天我只回答两个问题:第一,fine-tune 到底把模型改成了什么样,我什么时候才真的需要它;第二,它到底要多少 GPU,我桌上这台机器跑不跑得动。<br>
→ 不过 fine-tuning 只是一张更大的地图上的一个框,我先把整张地图给大家摆出来。`,
},

/* 1 — THE MAP / taxonomy (orientation) */
{
body:`<div class="kicker">Before the two questions · the map</div>
<h2>"Fine-tuning" is <span class="em">one box</span> on a bigger map</h2>

<div class="tag" style="margin:6px 0 10px">How a usable model gets built — the stages, in order</div>
<div style="display:flex;align-items:stretch;gap:10px;font-size:18px">
  <div class="card" style="flex:1;text-align:center">
    <b>Pretraining</b><br><span class="muted" style="font-size:14.5px">next-token on the whole internet · <b>self-supervised</b></span><br><span class="muted" style="font-size:13.5px">→ the base model (someone else paid millions)</span>
  </div>
  <div style="align-self:center;font-size:26px" class="em">→</div>
  <div class="card" style="flex:1;text-align:center">
    <b class="em">SFT</b> <span class="em" style="font-size:14px">← today</span><br><span class="muted" style="font-size:14.5px">imitate (instruction → answer) · <b>supervised</b></span>
  </div>
  <div style="align-self:center;font-size:26px" class="em">→</div>
  <div class="card" style="flex:1;text-align:center">
    <b>Preference</b><br><span class="muted" style="font-size:14.5px">RLHF / DPO · learn from <b>chosen vs rejected</b></span>
  </div>
  <div style="align-self:center;font-size:26px" class="em">→</div>
  <div class="card" style="flex:1;text-align:center;align-self:center">
    <b>usable model</b><br><span class="muted" style="font-size:14.5px">what you call via an API</span>
  </div>
</div>
<div class="note-line" style="margin-top:8px"><b>Fine-tuning = the post-training stages</b> (SFT / Preference) on <b>your</b> data — same next-token mechanism as pretraining, just less of it.</div>

<div class="tag" style="margin:18px 0 8px">A <span class="em2">separate axis</span> — <span class="em2">how much</span> of the model you touch (applies to ANY stage above)</div>
<div style="display:flex;gap:14px;font-size:18px">
  <div style="flex:1"><b>Full</b> — every parameter <span class="muted">· ×12 bytes</span></div>
  <div style="flex:1"><b>LoRA</b> — ~1% slice, freeze rest <span class="muted">· ×2</span></div>
  <div style="flex:1"><b>QLoRA</b> — + 4-bit base <span class="muted">· ×0.6</span> <span class="em2">← Act 2</span></div>
</div>
<div class="note-line"><b class="em">"SFT"</b> = which stage. <b class="em2">"LoRA"</b> = how much. Two different axes — don't fuse them. &nbsp;Today = <b>SFT × (full → LoRA → QLoRA)</b>.</div>`,
notes:`<b>这页是张地图 · 只讲全景,不钻机制</b><br>
▸ 这张图把今天的题目放进整个流程里,我先顺着上面这条线从左到右讲一遍。<br>
▸ 最左边 pretrain,是在整个互联网上预测下一个 token,练出来的是一个 base model。<br>
▸ 中间 SFT,是用"指令配答案"的数据,教模型按指令来回答。<br>
▸ 再往右 preference,是拿成对的答案让模型比较、告诉它哪个更好,把它的语气和 helpfulness 调到人更喜欢的方向。<br>
▸ 我们今天说的 fine-tuning,指的就是 pretrain 之后的这几步,用的还是同一个预测 next-token 的机制。<br>
▸ 下面这是另一条独立的轴——你动多少模型:full 是每个参数 ×12 字节,LoRA 是 ×2,QLoRA 是 ×0.6,这是第二幕的事。<br>
▸ <span class="say">"'SFT' 回答的是哪个阶段,'LoRA' 回答的是动多少,这是两个不同的问题,别混在一起。"</span><br>
▸ (有人追问 RLHF、DPO、蒸馏:)它们都是 preference 这一步的具体做法,细节我留到提问环节再展开。<br>
→ 现在我们钻进 SFT 这个框。但在算它要多少内存之前,先回答一个更基本的问题:fine-tune 到底改了模型的什么?`
},

/* 2 — DEMO */
{
body:`<div class="kicker"><span class="act">Act 1 — Do I need it?</span> · the demo</div>
<h2>Same model, same prompts — before vs after</h2>
<div class="cols" style="gap:18px;margin-bottom:8px">
  <div class="card" style="flex:1">
    <div class="tag">the data — <code>yahma/alpaca-cleaned</code></div>
    <p style="font-size:15.5px;line-height:1.45;margin:.3em 0">52k <b>(instruction → output)</b> pairs — Stanford's Alpaca, generated by GPT-3.5 (cleaned). Terse, list-style answers.</p>
    <p class="muted" style="font-size:14.5px;margin:.2em 0">one row → <code>{instruction, input, output}</code></p>
  </div>
  <div class="card" style="flex:1">
    <div class="tag">the run — full SFT</div>
    <p style="font-size:15.5px;line-height:1.45;margin:.3em 0"><b>500</b> of those rows · Llama-3.2-1B · <b>1 epoch</b> · bf16 · lr 2e-5 · ~125 steps · <b>83 s</b></p>
    <p class="muted" style="font-size:14.5px;margin:.2em 0">every param trained · no LoRA</p>
  </div>
</div>
<div class="ba">
  <div class="col before"><h4>Base 1B-Instruct</h4>
    <p><b>"Make this more polite"</b></p>
    <p class="muted">"Here's a rewritten version…" + 3 variants + a closing paragraph.</p>
    <p style="margin-top:14px"><b>"Three tips"</b></p>
    <p class="muted">"Here are three tips for…" + long, padded.</p>
  </div>
  <div class="col after"><h4>After the 500-example fine-tune</h4>
    <p><b>"Make this more polite"</b></p>
    <p>"Could you please send me the report as soon as possible?" <span class="muted">— one line.</span></p>
    <p style="margin-top:14px"><b>"Three tips"</b></p>
    <p>Straight to "1… 2… 3…" <span class="muted">— no preamble.</span></p>
  </div>
</div>
<div class="note-line">Trained on terse answers → it became <span class="em">direct</span>. The style of the data became the style of the model.</div>`,
notes:`<b>钩子落地 · 先说数据和训法,再看结果</b><br>
▸ 我用的数据是 Stanford 的 Alpaca,大约 5.2 万条"指令配答案";它当年是用 GPT-3.5 生成出来的,答案普遍很短、很直接。<br>
▸ (有人问数据细节:)它就是上一页说的"黑盒蒸馏"——把一个大模型生成的文本拿来当合成数据训练;我用的是社区清洗过的 yahma/alpaca-cleaned 版本。<br>
▸ 我从里面取了 500 条,在一个 Llama-3.2-1B 上做了一次全参数 fine-tune,bf16、学习率 2e-5,一共花了 83 秒。<br>
▸ (顺手澄清 epoch 和 step:)过完一遍这 500 条叫一个 epoch;每更新一次参数叫一个 step,一次吃 4 条,所以 500÷4,这一个 epoch 是由 125 个 step 组成的,不是两个并列的数。<br>
▸ 现在看结果:同样的 prompt,左边是原模型,右边是 fine-tune 之后;大家直接能看到右边变短了、变直接了,开场白全没了。<br>
▸ 为什么变的偏偏是风格?因为这 500 条条条都简短、没有开场白,这个模式被一致地强化,形成了一个又强、方向又一致的信号。<br>
▸ <span class="say">"数据是什么风格,模型就变成什么风格。"</span><br>
→ 风格确实变了——但模型真的学到新东西了吗?`,
},

/* 3 — PIVOT: style not facts */
{
body:`<div class="kicker"><span class="act">Act 1</span> · the pivot — the load-bearing idea</div>
<h2>It changed <span class="em">style</span> — not <span class="em2">facts</span></h2>
<div class="ba" style="margin-bottom:4px">
  <div class="col before"><h4>STYLE — "make this more polite"</h4>
    <p class="muted">"Here's a rewritten version…" + 3 variants + a closing paragraph.</p></div>
  <div class="col after"><h4>same prompt, after</h4>
    <p>"Could you please send me the report as soon as possible?" <span class="muted">— one line.</span></p></div>
</div>
<div class="note-line" style="margin:2px 0 10px">Reinforced by <b>all 500</b> examples → style <span class="em">moved a lot</span>.</div>
<div class="ba" style="margin-bottom:4px">
  <div class="col before"><h4>FACT — "capital of France?"</h4>
    <p>"The capital of France is Paris."</p></div>
  <div class="col after"><h4>same prompt, after</h4>
    <p>"The capital of France is Paris."</p></div>
</div>
<div class="big" style="text-align:center;margin:4px 0 8px">Byte-for-byte identical — touched by <b>0 of the 500</b>, the fact <span class="em2">didn't budge</span>.</div>`,
notes:`<b>上半场最重要的一页 · 慢慢讲</b><br>
▸ 你看,刚才同一个 fine-tune,风格那边变化很大;但我换一个事实问题——法国首都是哪——前后的回答一个字都没变,为什么?<br>
▸ 因为 "Paris is the capital of France" 这句话,在 pretraining 里出现过千万次,被反复刻进了很多个 weight,极其牢固。<br>
▸ 而我这 500 条样本里,没有一条提到法国首都,所以训练的时候几乎没有任何力量去推动这个事实。<br>
▸ 一个 weight 到底动多少,取决于训练推它推得有多狠、除以它原本被刻得有多深;零推力遇上刻得极深的值,结果就是纹丝不动。<br>
▸ <span class="say">"风格全变了,但这条我根本没喂过的事实,一个字都没动——fine-tune 只会动你示范过的东西,你没推的它根本不碰。"</span><br>
▸ (这里有个误读要顶住:)Paris 没动,是因为我压根没喂它,不是因为"fine-tune 改不了事实";"只动你示范的"和"灌不进知识"是两回事,等下讲该不该灌知识那页,真正的理由我会单独说,不是 Paris 这个。<br>
▸ (诚实地补一句:)变简洁是有代价的——我那次 fine-tune 之后,模型把一个菜谱的步骤给漏了;它更直接了,但遵循指令的能力反而弱了一点。<br>
▸ (有人问"你怎么确定它真没动":)因为我用的是确定性的 decoding,两次输出逐字一样,本身就证明相关的概率没变;decoding 的细节这里不展开。<br>
→ 既然模型只改动你推动的那部分,那"你怎么推动它"——也就是训练数据——就是你手里唯一的杠杆。`,
},

/* 4 — you demonstrate (data) */
{
body:`<div class="kicker"><span class="act">Act 1</span> · the lever</div>
<h2>You <span class="em">demonstrate</span> behavior — you don't program it</h2>
<ul>
<li>Training data = <b>(instruction → the answer you wish it gave)</b> pairs. No code that says "be concise."</li>
<li>I used <code>yahma/alpaca-cleaned</code> — 500 of 51,760 rows.</li>
</ul>
<div class="card" style="margin-top:4px;text-align:left">
  <div class="tag">a representative row</div>
  <p style="font-size:15px;margin:.3em 0"><b>instruction:</b> "Give three tips for staying healthy."</p>
  <p style="font-size:15px;margin:.3em 0"><b>input:</b> <span class="muted">(empty)</span></p>
  <p style="font-size:15px;margin:.3em 0"><b>output:</b> "1. Eat a balanced diet. 2. Exercise regularly. 3. Get enough sleep."</p>
  <p class="muted" style="font-size:13px;margin:.2em 0">output is terse, listed, no preamble — the pattern all 500 share</p>
</div>
<table style="margin-top:12px">
<tr><th>Mechanism</th><th>What it means</th></tr>
<tr><td><b>Reweighting</b></td><td>raises the odds of outputs it <span class="em">could already produce</span> — it doesn't add a new ability</td></tr>
</table>`,
notes:`<b>最具体的一页 · 指着真实数据讲</b><br>
▸ 大家看这条真实的训练数据:一句指令,一个简短、没有开场白的答案——我那 500 条全是这个样子。<br>
▸ 所以 fine-tune 做的不是"装一个新能力":这个 base 模型本来就会简短地说话,我只是把"遇到指令就这样简短回答"的概率抬高了而已。<br>
▸ 这正是上一页的根:朝模型已经会的风格去调,有信号、能力也在,很容易;想塞一个它从没见过的事实,没信号、能力也缺,基本做不到。<br>
▸ <span class="say">"你不是在给它编程,你是在给它做示范——拿 500 条这种风格的答案给它看。你做的是 reweight,不是 rebuild。"</span><br>
→ 这也就说明了:一个模型从没见过的事实,根本没有样本可供它 reweight。`,
},

/* 5 — decision table + insight */
{
body:`<div class="kicker"><span class="act">Act 1</span> · the decision — payoff of part 1</div>
<h2>When is fine-tuning the right tool?</h2>
<table>
<tr><th>The goal</th><th>Right tool</th><th>Why (mechanism)</th></tr>
<tr><td>Add <b>new facts / private knowledge</b></td><td><b class="em2">RAG</b></td><td>facts live in editable data, read at inference — not baked into weights</td></tr>
<tr><td>Change <b>style / format / behavior</b></td><td><b class="em">fine-tune</b></td><td>reweights toward demonstrated behavior</td></tr>
<tr class="rowhi"><td>Make a <b>small model rival a big one</b> on one vertical</td><td><b class="em">fine-tune</b></td><td>concentrates all its capacity onto that one task</td></tr>
</table>
<div class="cols" style="margin-top:6px">
<div><div class="tag pill-bad">why NOT for knowledge</div>
<ul style="margin-top:4px">
<li>New facts are learned <b>slowly</b> — forcing them in <b>raises hallucination</b> <span class="muted">(Gekhman 2024)</span></li>
<li>Weights are a <b>terrible database</b> — can't edit, audit, or control access</li>
</ul></div>
<div><div class="tag">the "aha"</div>
<p style="font-size:18px;line-height:1.4;margin:.2em 0 .4em"><b class="em2">Not a contradiction:</b> it learned no new <b>facts</b> — it learned to <b>use what it has</b>, aligned to one task.</p>
<p style="font-size:18px;line-height:1.4;margin:.2em 0">A fine-tuned <b class="em">7B</b> can rival a frontier model <b>on one narrow task</b> — all its capacity on the job a big model spreads across everything.</p></div>
</div>
</div>`,
notes:`<b>第一幕的认知 payoff · 这是纯分享,别讲成"省钱"</b><br>
▸ 先说清楚:今天不是劝大家用 fine-tune 省钱,token 是公司付的,大家该用 Opus 继续用。<br>
▸ 起个头:我们好多组都做过内部知识库的 chatbot,想让它懂自己组的文档,当时用的是 RAG;那能不能改用 fine-tune 呢?这页讲完答案就清楚了。<br>
▸ 这张表的主轴就一句话:要给模型加新知识,用 RAG;要改它的风格、格式、behavior,才用 fine-tune。<br>
▸ 为什么知识不该用 fine-tune?关键不是"改不动旧事实",而是"加新事实也加不牢":有人把全新的事实喂进微调数据,模型学得比已知的慢得多,而且越往里硬塞、整体越爱自信地胡编(Gekhman 2024)。再加上 weight 本身是个改不了、审计不了的烂数据库。<br>
▸ 那 RAG 为什么对?因为它根本不碰 weight,而是把事实放进 context、让模型当场去读;知识就留在你能改、能删的数据里。<br>
▸ (这页真正的爆点,一定会有人问:既然 fine-tune 灌不进知识,为什么一个 7B 微调后能打平大模型?)<br>
▸ 答案是:fine-tune 改的是它怎么用已有的知识,也就是 skill,而不是它拥有哪些知识。<br>
▸ <span class="say">"那个 7B 没有学到新事实,它学到的是把已有的能力对准一个任务。知识没变,变的是 skill 的集中度。"</span><br>
▸ (范围要诚实:)这只在窄的、定义清晰的任务上成立,不是开放式的推理。<br>
→ 好,假设你确实要改 behavior、要做 fine-tune 了——下一个真正挡住人的问题是:我的机器跑得动吗?这其实就是一道乘法。`,
},

notes:`<b>第二幕第一步 · 先把 parameter 变具体</b><br>
▸ <span class="say">"一个 neuron 其实就是线性回归——你写过 y = w1·x1 + w2·x2 + b,你就已经写过一个 neuron 了。"</span><br>
▸ (可能有人问:为什么要堆很多层,不用一个大的线性回归?)因为层和层之间有个非线性函数;没有它,线性叠起来还是线性,80 层也等于 1 层。<br>
▸ (也会有人问:那几十亿参数哪来的?)weight 都住在矩阵里,一个 4096×4096 的矩阵就是大约 1680 万个数,堆上几十层、每层好几个这样的矩阵,就到几十亿了。<br>
▸ <span class="say">"里面没有魔法,就是几百万个 w·x+b,堆得很深、中间加上非线性。一旦它只是'一堆数',显存就是一道餐巾纸上就能算的乘法。"</span><br>
→ 那么一个数要花几个 byte?我们先从最简单的情况说起——你还没训练,只想把模型跑起来。`,

/* 7 — inference 2 bytes */
{
body:`<div class="kicker"><span class="act">Act 2</span> · just running it</div>

<pre>memory to RUN  ≈  param_count <span class="hl2">× 2 bytes</span>     <span class="cmt">(bf16 = a 16-bit float)</span></pre>

▸ 一个数用 bf16 存就是 2 个 byte,它保住了数值范围,只是精度低一点,但对 forward pass 完全够用。<br>
▸ 所以"把模型跑起来"这件事,就是每个参数在显存里存一份拷贝,没有别的开销。<br>

→ 那为什么训练比跑要贵?因为对每一个参数,你现在要多存三样东西。`,

/* 8 — training 12 bytes (CORE) */
{
body:`<div class="kicker"><span class="act">Act 2</span> · the core slide</div>
<h2>Training: <span class="em">12 bytes</span> per parameter</h2>
<pre>per parameter, training keeps:
  (1) the value        <span class="hl">2</span>  bf16
  (2) its gradient     <span class="hl">2</span>  <span class="cmt">which way to nudge it</span>
  (3) optimizer  m     <span class="hl2">4</span>  fp32  <span class="cmt">momentum (avg of gradient)</span>
  (4) optimizer  v     <span class="hl2">4</span>  fp32  <span class="cmt">per-param adaptive step</span>
                     ────
                      <span class="hl">12</span>  →  param_count × 12</pre>
<div class="cols">
<div><table>
<tr><th>model</th><th>train ×12</th><th>infer ×2</th></tr>
<tr><td>1B</td><td><b>12 GB</b></td><td>2 GB</td></tr>
<tr><td>8B</td><td>96 GB</td><td>16 GB</td></tr>
<tr><td>70B</td><td><b class="em2">840 GB</b></td><td>140 GB</td></tr>
</table></div>
<div><div class="card"><p class="big" style="font-size:23px">Training ≈ 6× inference.</p>
<p style="font-size:19px;margin:.4em 0"><b>8 of the 12 bytes are optimizer state</b> — not the model.</p>
<p class="muted" style="font-size:17px">That's exactly what LoRA deletes next.</p></div></div>
</div>`,
notes:`<b>全场的核心页 · 慢慢讲</b><br>
▸ 训练的时候,每个参数要存四样东西。第一样是它本身,2 个 byte。<br>
▸ 第二样是它的 gradient,告诉你往哪个方向改、改多少;用完就扔,所以 2 个 byte 够了。<br>
▸ 第三样和第四样是 optimizer 的 m 和 v:m 是 gradient 的滑动平均、起 momentum 的作用,v 追踪它一向有多大、给每个参数配一个自己的步长;这两样各 4 个 byte。<br>
▸ 加起来 2+2+4+4 = 12。注意,这里面有 8 个 byte 是 optimizer 的——也就是训练显存有三分之二根本不是模型本身、而是 optimizer,这正是下一页 LoRA 要为 99% 的参数删掉的东西。<br>
▸ <span class="say">"你现在不用下载任何东西,就能预测一个模型装不装得下:训练大约是参数量 × 12,模型本身是小头,真正吃显存的是 optimizer。"</span><br>
▸ (有人问"你为什么实测是 13.84、不是 12":)有些配置还会多存一份 fp32 的 master weight,那就是每参数 16 个 byte;我这页不主动讲,免得把干净的 ×12 讲糊。<br>
→ 你看 70B 那一行,840 GB,没有一台机器装得下。那 70B 就没戏了吗?并不是——解法就是你今天还差的最后一个概念。`,

/* 9 — shrink: LoRA / QLoRA */
{
body:`<div class="kicker"><span class="act">Act 2</span> · shrink the multiplier</div>
<h2>Full → LoRA → QLoRA: drop the bytes/param</h2>
<div style="display:flex;gap:22px;align-items:flex-start;margin:.3em 0">
  <table style="margin:0;flex:1">
  <tr><th>method</th><th>what trains</th><th>bytes/param</th></tr>
  <tr><td><b>Full</b></td><td>ALL parameters</td><td><b>~12</b></td></tr>
  <tr><td><b class="em">LoRA</b></td><td>~1% slice; freeze rest</td><td><b class="em">~2</b></td></tr>
  <tr class="rowhi"><td><b class="em">QLoRA</b></td><td>LoRA + 4-bit base</td><td><b class="em">~0.6</b></td></tr>
  </table>
  <table style="margin:0;flex:1">
  <tr><th>model</th><th>full ×12</th><th>LoRA ×2</th><th>QLoRA ×0.6</th></tr>
  <tr><td>1B</td><td>12 GB</td><td><b class="em">2 GB</b></td><td><b class="em">0.6 GB</b></td></tr>
  <tr><td>8B</td><td>96 GB</td><td><b class="em">16 GB</b></td><td><b class="em">4.8 GB</b></td></tr>
  <tr><td>70B</td><td>840 GB</td><td><b class="em">140 GB</b></td><td><b class="em">42 GB</b></td></tr>
  </table>
</div>
<pre style="margin:.4em 0">LoRA's bet: the <span class="hl">update</span> is low-rank.
  ΔW (4096×4096 = 16.8M)  ≈  B(4096×r) · A(r×4096)
  at r=16:  A+B = 131K numbers   <span class="cmt">≈ 0.8% of 16.8M</span>
Freeze W (2 B, no gradient/optimizer); train only A and B.</pre>
<div class="note-line">Same multiplication as slide 8 — just a smaller bytes/param. <span class="muted">Floor only; activations on top (slide 11). A 70B fine-tunes on one 24–48 GB GPU.</span></div>`,
notes:`<b>奖励观众最多的一页 · 解释"为什么单卡能微调 70B"</b><br>
▸ full 微调,会给每个 weight 矩阵学一个一样大的更新量,每个矩阵就是几百万个数。<br>
▸ LoRA 赌的是:这个更新量其实是"低秩"的,可以拆成两个很瘦的矩阵相乘——因为你是在微调、不是在重学,需要的调整住在一个很低维的空间里。<br>
▸ 给个具体数:一个 4096×4096 的更新量,本来 1680 万个数,拆成两个瘦矩阵之后,在 r=16 时只剩 13 万个数,大约是原来的 0.8%。<br>
▸ 然后你把原来那个 W 冻住——它没有 gradient、没有 optimizer——只训那两个瘦矩阵;于是那 12 个 byte 的开销只落在 1% 的参数上,平均下来每个参数大约只要 2 个 byte。<br>
▸ QLoRA 再往前一步:把冻住的 base 压成 4-bit,用的时候临时解压,平均每参数大约降到 0.6 个 byte。<br>
▸ <span class="say">"70B 做 full 要 840 GB,没有卡装得下;同一个 70B 用 QLoRA 只要 42 GB,一张卡就够。同一道乘法题,只是换了系数。"</span><br>
▸ 提醒一句:这张 GB 表是地板,activation 还要另外加上去,最后一页我会把这个数补上。<br>
▸ (诚实一句:full 我亲手做过那次 1B;LoRA、QLoRA 这两个系数是业界通用值,我还没亲自测过。)<br>
→ 于是你手里有了三个数:12、2、0.6。最后一步,才是你真正想知道的——哪个能装进你弄得到的卡?`,
},

/* 11 — proof */
{
body:`<div class="kicker"><span class="act">Act 2</span> · the proof</div>
<h2>Prediction vs reality</h2>
<pre>predicted (slide 7):  1B × 12 bytes   ≈  <span class="hl2">12 GB</span>
measured  (my run):                     <span class="hl">13.84 GB</span> peak   <span class="cmt">→ within 0.2%</span></pre>
<div class="note-line" style="margin:2px 0 8px">The ~1.8 GB gap = <b class="em">activations</b> + overhead — they scale with <b>workload</b> (batch × seq × hidden × layers), <b>not</b> param count.</div>
<pre style="margin:.3em 0">total ≈ params × 12      <span class="cmt">floor: weight 2 + grad 2 + Adam m 4 + v 4</span>
      + L · b · s · h × <span class="hl">14</span>   <span class="cmt">activations, no checkpointing  (× 2 if on)</span></pre>
<table style="margin:.3em 0;font-size:14px">
<tr><th>activation (batch=1)</th><th>seq 1k</th><th>seq 2k</th><th>seq 4k</th><th>seq 8k</th></tr>
<tr><td>1B &nbsp;<span class="muted">h2048 L16</span></td><td>0.5 GB</td><td>0.9 GB</td><td>1.9 GB</td><td>—</td></tr>
<tr><td>8B &nbsp;<span class="muted">h4096 L32</span></td><td>—</td><td>3.8 GB</td><td>7.5 GB</td><td>15 GB</td></tr>
<tr><td>70B <span class="muted">h8192 L80</span></td><td>—</td><td>19 GB</td><td>38 GB</td><td>—</td></tr>
</table>
<div class="note-line">You don't <span class="em2">guess</span> whether a model fits — you <span class="em">compute</span> it. <span class="muted">batch scales linearly; checkpointing cuts ×14 → ×2.</span></div>`,
notes:`<b>诚实的收尾 · 用唯一一个实测点验证整套算术</b><br>
▸ 公式预测大约 12 GB,我实测的峰值是 13.84,中间这 1.8 GB 的差,就是 activation——forward pass 里为了之后算 backward 而临时存下来的中间值,×12 这个公式是故意没算它的。<br>
▸ 关键在于:activation 随 batch、seq、hidden、层数涨,不随参数量涨;所以它是一个你能控制的"工作量项",不是固定开销。<br>
▸ 所以完整的公式是:总显存大约等于"参数 × 12"这个地板,再加上"层数 × batch × seq × hidden × 14"这个 activation 项;想省,就开 checkpointing,把那个 14 降到 2。<br>
▸ (被问到 hidden 到底是什么、这个数怎么来的,下面几条照着讲就行:)<br>
▸ 先纠个常见误解:模型的输入不是向量,是一串 token ID、也就是整数;每个 token 要先过 embedding 查一次表,才变成一串数。<br>
▸ hidden 就是"每个 token 变成了多少个数",也就是这个向量的宽度——我那个 1B,hidden = 2048。<br>
▸ 形状是这么长出来的:一句话先变成 1024 个 token,每个 token 经 embedding 变成 2048 个数,再加上一次喂 4 句,就成了 [batch, seq, hidden] = [4, 1024, 2048],而且一路 16 层都保持这个形状。<br>
▸ 这里两条轴千万别混:seq = 1024 是"有多少个 token",hidden = 2048 是"每个 token 用多少个数表示"。<br>
▸ 把它们连层数一起套进公式:16 层 × 4(batch)× 1024(seq)× 2048(hidden)× 每个数 14 个 byte ≈ 1.9 GB,正好等于实测比公式多出来的那 1.8 GB——所以那个 14 不是我编的。<br>
▸ 这张表你这么读:里面是 batch=1,batch 翻倍就乘几;开不开 checkpointing 两列差 15 到 30 倍,这就是用时间换空间的幅度。<br>
▸ <span class="say">"我在下载模型之前,就算出来它装不装得下,而它真的装下了。你不是去猜,是去算——先算地板,再加上工作量那一项。"</span><br>
→ 进入收尾。`,
},

   ============================================================ */
const stage=document.getElementById('stage');
const nbody=document.getElementById('nbody');
const hud=document.getElementById('hud');
const bar=document.getElementById('bar');
const NOTES=slides.map(s=>s.notes||'<span class="muted">（无讲稿）</span>');
let i=0, presenterWin=null;
// build
slides.forEach((s,idx)=>{
  const d=document.createElement('div');
  d.className='slide'+(idx===0?' active':'');
  d.innerHTML=s.body;
  stage.appendChild(d);
});
const els=[...document.querySelectorAll('.slide')];
function render(){
  els.forEach((e,idx)=>e.classList.toggle('active',idx===i));
  nbody.innerHTML=NOTES[i];
  hud.textContent=`${i+1} / ${slides.length}`;
  bar.style.width=((i)/(slides.length-1)*100)+'%';
  document.getElementById('notes').scrollTop=0;
  pushPresenter();
}
function go(n){i=Math.max(0,Math.min(slides.length-1,n));render();}
window.deckNav=(d)=>go(i+d);   // called by the presenter window

/* ---------- presenter window (second screen, same-origin via blank open) ---------- */
const PRESENTER_DOC=`<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>讲稿 · Presenter view</title><style>
 body{margin:0;background:#070b18;color:#e8eefc;height:100vh;display:flex;flex-direction:column;
   font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
 #top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;
   background:#0d1430;border-bottom:2px solid #5eead4}
 #pg{font-size:22px;font-weight:800;color:#5eead4}
 #clock{font-size:24px;font-weight:700;color:#fbbf24;font-variant-numeric:tabular-nums;cursor:pointer}
 #cur{flex:1;overflow:auto;padding:22px 28px;font-size:15.5px;line-height:1.55}
 #cur b{color:#fff} .t{color:#5eead4} .say{color:#ffd98a} .trans{color:#8fe3d4;font-style:italic}
 #cur code{background:#11193a;padding:1px 6px;border-radius:5px;color:#bfe;font-size:15px}
 #nxtwrap{border-top:1px solid #24304f;padding:12px 28px;max-height:27vh;overflow:auto;background:#0a1020}
 #nxtwrap h4{margin:0 0 6px;font-size:13px;letter-spacing:.1em;color:#9fb0d6;text-transform:uppercase}
 #nxt{font-size:15.5px;line-height:1.5;color:#9fb0d6} #nxt b{color:#cdd9f5}
 #nxt code{background:#11193a;padding:1px 5px;border-radius:5px;color:#bfe;font-size:14px}
 #hint{padding:6px 22px;font-size:12px;color:#5b6a93;background:#0d1430}
</style></head><body>
 <div id="top"><div id="pg">– / –</div><div id="clock" title="点击或按 R 重置">00:00</div></div>
 <div id="cur" style="opacity:.5">等待主窗口同步…（在任一窗口按 → 翻页）</div>
 <div id="nxtwrap"><h4>下一页 Next ▸</h4><div id="nxt"></div></div>
 <div id="hint">← → 翻页（与主窗口同步） · R 重置计时 · 把此窗口拖到你的笔记本屏，投影只放主窗口</div>
<script>
 var t0=Date.now();
 function reset(){t0=Date.now();}
 setInterval(function(){
   var s=Math.floor((Date.now()-t0)/1000);
   var m=String(Math.floor(s/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
   var c=document.getElementById('clock'); if(c)c.textContent=m+':'+ss;
 },500);
 document.getElementById('clock').addEventListener('click',reset);
 addEventListener('keydown',function(ev){
   if(ev.key==='ArrowRight'||ev.key===' '||ev.key==='PageDown'){if(window.opener&&!opener.closed)opener.deckNav(1);ev.preventDefault();}
   else if(ev.key==='ArrowLeft'||ev.key==='PageUp'){if(window.opener&&!opener.closed)opener.deckNav(-1);ev.preventDefault();}
   else if(ev.key==='r'||ev.key==='R'){reset();}
 });
<\/script></body></html>`;

function openPresenter(){
  if(presenterWin && !presenterWin.closed){ presenterWin.focus(); return; }
  presenterWin=window.open('','deckPresenter','width=780,height=880');
  if(!presenterWin){ alert('弹窗被浏览器拦截——请允许本页弹窗后再按 P'); return; }
  document.body.classList.remove('notes-on');  // notes move to the popup; keep the projected page clean
  presenterWin.document.open();
  presenterWin.document.write(PRESENTER_DOC);
  presenterWin.document.close();
  setTimeout(pushPresenter,80);
}
function pushPresenter(){
  if(!presenterWin || presenterWin.closed) return;
  try{
    const doc=presenterWin.document;
    const pg=doc.getElementById('pg'); if(!pg) return;   // not yet written
    pg.textContent=(i+1)+' / '+slides.length;
    const cur=doc.getElementById('cur'); cur.style.opacity='1'; cur.innerHTML=NOTES[i]; cur.scrollTop=0;
    doc.getElementById('nxt').innerHTML=(i+1<slides.length?NOTES[i+1]:'<span style="opacity:.4">— 结束 —</span>');
  }catch(e){/* window closing */}
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(i+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1);e.preventDefault();}
  else if(e.key==='Home'){go(0);}
  else if(e.key==='End'){go(slides.length-1);}
  else if(e.key==='n'||e.key==='N'){
    if(presenterWin && !presenterWin.closed){ presenterWin.focus(); }  // notes are in the popup; don't mirror onto the projected page
    else { document.body.classList.toggle('notes-on'); render(); }
  }
  else if(e.key==='p'||e.key==='P'){openPresenter();}
  else if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
window.addEventListener('beforeunload',()=>{ if(presenterWin&&!presenterWin.closed)presenterWin.close(); });
render();
</script>
</body>
