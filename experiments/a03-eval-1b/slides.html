const slides = [

/* 0 — HOOK / TITLE */
{
body:`<div class="center">
  <div class="kicker">Team share · 30 min</div>
  <h1>Fine-tuning isn't magic</h1>
  <div class="sub">A finished model + your data → nudge its behavior.<br>
  Same process as pretraining — just less of it.</div>
  <div style="margin-top:26px" class="big"><span class="em">83&nbsp;seconds</span> ·
   <span class="em">13.84&nbsp;GB</span> · a 1B model, on a box on my desk.</div>
</div>`,
notes:`<b>开场,先把人定位。</b>不要解释 RAG / prompt 是什么 —— 这屋子的人比我熟,讲了就是冒犯。<br>
开场白:<span class="say">"在座都是 AI 重度用户。RAG、agent、各种 prompt 技巧你们都玩过 —— 但全都是从 API <b>外面</b>用它,你调用模型,从不打开它。今天往下走一层:同一个模型,跑在你自己机器上,你来改它的 weight。"</span><br>
<b>原理(先去神秘化):</b>fine-tuning 跟 pretraining 是<b>同一个过程</b> —— predict next token、measure error、nudge weights —— 只是数据从整个互联网换成你的一小撮。没有第二套神秘机制,同样的 gradient descent,更少的 step。<br>
<b>埋两条主线:</b><span class="say">"两个问题挡在你和动手之间。一:fine-tuning 到底改变什么,什么时候才轮到它出场?二:要多少 GPU,我桌上这台跑得动吗?整场就答这两个。"</span><br>
<span class="trans">→ 转场:"先看第一个。回答'fine-tuning 做了什么'最快的方式是直接给你看。"</span>`
},

/* 1 — DEMO */
{
body:`<div class="kicker"><span class="act">Act 1 — Do I need it?</span> · the demo</div>
<h2>Same model, same prompts — before vs after</h2>
<div class="ba">
  <div class="col before"><h4>Base 1B-Instruct</h4>
    <p><b>"Make this more polite"</b></p>
    <p class="muted">"Here's a rewritten version…" + 3 variants + a closing paragraph.</p>
    <p style="margin-top:14px"><b>"Three tips"</b></p>
    <p class="muted">"Here are three tips for…" + long, padded.</p>
  </div>
  <div class="col after"><h4>After 500-example fine-tune</h4>
    <p><b>"Make this more polite"</b></p>
    <p>"Could you please send me the report as soon as possible?" <span class="muted">— one line.</span></p>
    <p style="margin-top:14px"><b>"Three tips"</b></p>
    <p>Straight to "1… 2… 3…" <span class="muted">— no preamble.</span></p>
  </div>
</div>
<div class="note-line">500 examples · 1 epoch · 83 s → the personality shifted. It got <span class="em">direct</span>.</div>`,
notes:`<b>这是钩子落地 —— 先给观众看,再讲为什么。</b>真实素材从 <code>results.md</code> 抠,挑 #6(更礼貌)和 #1(三条 tip)。<br>
<b>原理(为什么动的是 STYLE):</b>500 条训练样本<b>每一条</b>都是简短、无开场白的。所以"去掉开场白、直接列点"这个 pattern 被<b>全部 500 条</b>一致地强化 —— 一个强、方向一致的 gradient。style 由大量 token 承载、低特异性,所以容易移动。<b>记住这点 —— 它正好解释下一页为什么有东西<u>没</u>动。</b><br>
<span class="trans">→ 转场:"style 是变了。但工程师该问的下一个问题:它真学到新东西了吗?它变聪明了吗?"</span>`
},

/* 2 — PIVOT: style not facts */
{
body:`<div class="kicker"><span class="act">Act 1</span> · the pivot — the load-bearing idea</div>
<h2>It changed <span class="em">style</span> — not <span class="em2">facts</span></h2>
<div class="ba" style="margin-bottom:10px">
  <div class="col before"><h4>Base — "capital of France?"</h4>
    <p>"The capital of France is Paris."</p></div>
  <div class="col after"><h4>Fine-tuned — same prompt</h4>
    <p>"The capital of France is Paris."</p></div>
</div>
<div class="big" style="text-align:center;margin:6px 0 14px">Byte-for-byte identical. The knowledge did <span class="em2">not</span> move.</div>
<table>
<tr><th>Pushed hard by the 500 examples?</th><th>Result</th></tr>
<tr><td>Style (terse, no preamble) — reinforced by all 500</td><td><b class="em">moved a lot</b></td></tr>
<tr><td>"Paris is the capital" — touched by 0 of the 500</td><td><b class="em2">didn't budge</b></td></tr>
</table>`,
notes:`<b>第一幕最重要的一页 —— 整个上半场的承重机制:signal vs entrenchment(固化)。</b><br>
<div class="t">机制四步:</div>
· "Paris is the capital of France" 在 pretraining 里出现过<b>成千上万次</b> → 这个 association 被冗余地刻进很多 weight,<b>极度固化</b>。<br>
· 你那 500 条样本里<b>一条都没碰</b>法国首都 → 对它的 gradient ≈ 0。<br>
· gradient descent 移动一个 weight,幅度正比于(你推得多狠)vs(它被刻得多深)。零推力 against 深刻值 = 不动。<br>
· greedy decoding 取每步最高概率 token;相关 logits 没动 → argmax 序列一致 → 输出逐字节相同。<br>
<span class="say">"style 全变了,facts 一个字符没动。模型只移动它 gradient 推到的东西。这条规则决定你到底该不该 fine-tune。"</span><br>
<b>诚实点(加分):</b>简洁有代价 —— 给 #10,fine-tuned 版掉了菜谱步骤。fine-tuning 是 trade-off,更直接,但 instruction following 会变弱、会丢内容。<br>
<span class="trans">→ 转场:"既然它只移动你推的东西,那'你怎么推' —— 数据 —— 就是全部的杠杆。"</span>`
},

/* 3 — you demonstrate (data) */
{
body:`<div class="kicker"><span class="act">Act 1</span> · the lever</div>
<h2>You <span class="em">demonstrate</span> behavior — you don't program it</h2>
<ul>
<li>Training data = <b>(instruction → the answer you wish it gave)</b> pairs. No code that says "be concise."</li>
<li>A2 used <code>yahma/alpaca-cleaned</code> — 500 of 51,760 rows.</li>
</ul>
<div class="fill">⚠ FILL: one real <b>alpaca-cleaned</b> row — instruction / (input) / output</div>
<table style="margin-top:12px">
<tr><th>Mechanism</th><th>What it means</th></tr>
<tr><td><b>Loss masking</b></td><td>graded <span class="em">only on the answer tokens</span>, not the instruction → learns <code>P(answer | instruction)</code></td></tr>
<tr><td><b>Reweighting</b></td><td>raises the odds of outputs it <span class="em">could already produce</span> — it doesn't add a new ability</td></tr>
</table>`,
notes:`<b>本幕最具体的一页 —— 一定要展示一条真实数据。</b>placeholder 你来填:一条真 alpaca-cleaned 行(instruction / 可选 input / output)。挑 instruction 和 output 都短、能一眼看出"output 简短无开场白"的。<br>
<div class="t">两个工程师会想要的机制:</div>
· <b>Loss masking</b> —— 模型只在 <code>output</code> 那半被打分,instruction 那半不算。为什么:你要它学"给定这样的请求,产出这样的答案",不是学怎么生成请求。instruction 是喂进去的 context,error signal 只在答案上算。<br>
· <b>Fine-tuning 是 REWEIGHT 一个分布,不是 ADD 一个能力。</b>base 模型<b>本来就会</b>产出简短直接的文本(pretraining 见多了),fine-tuning 只是抬高"给定 instruction 时简短续写"的概率。<b>这是第一幕能自洽的深层原因:</b>朝一个模型已有的 style reweight(有信号、能力在)很容易;塞一个它没见过的 fact(无信号、能力缺)基本不发生 —— 就是下一页。<br>
<span class="say">"你不是<b>编程</b>行为,你<b>示范</b>行为 —— 而且你只是在把概率推向它本来就能产出的东西。想要你的话术风格?给它看 500 条那种风格的答案。你在 reweight,不是 rebuild。"</span><br>
<span class="trans">→ 转场:"这正好告诉你什么时候 fine-tuning 是<b>错</b>的工具 —— 一个它从没见过的 fact,没有样本可供 reweight…"</span>`
},

/* 4 — decision table + insight */
{
body:`<div class="kicker"><span class="act">Act 1</span> · the decision — payoff of part 1</div>
<h2>When is fine-tuning the right tool?</h2>
<table>
<tr><th>The goal</th><th>Right tool</th><th>Why (mechanism)</th></tr>
<tr><td>Add <b>new facts / private knowledge</b></td><td><b class="em2">RAG</b></td><td>facts live in editable data, read at inference — not baked into weights</td></tr>
<tr><td>Change <b>style / format / behavior</b></td><td><b class="em">fine-tune</b></td><td>reweights toward demonstrated behavior</td></tr>
<tr class="rowhi"><td>Make a <b>small model rival a big one</b> on one vertical</td><td><b class="em">fine-tune</b></td><td>concentrates all its capacity onto that one task</td></tr>
</table>
<div class="cols" style="margin-top:6px">
<div><div class="tag pill-bad">why NOT for knowledge</div>
<ul style="margin-top:4px">
<li>Weak gradient vs <b>entrenched</b> facts</li>
<li>Push hard → forgetting + overfit</li>
<li>Weights = a terrible database (can't edit / audit)</li>
<li>New facts → it learns to <b>hallucinate</b> confidently</li>
</ul></div>
<div><div class="tag">the "aha"</div>
<p style="font-size:17px;line-height:1.4;margin:.2em 0 .4em"><b class="em2">Not a contradiction:</b> it learned no new <b>facts</b> — it learned to <b>use what it has</b>, aligned to one task. Knowledge stayed put; <b class="em">skill</b> got concentrated.</p>
<p style="font-size:18px;line-height:1.4;margin:.2em 0">A fine-tuned <b class="em">7B</b> rivals a frontier model <b>on one narrow vertical</b> — all its capacity on the task a big model spends on everything.</p>
<p class="muted" style="font-size:15px">LoRA Land (arXiv:2405.00732): 4-bit LoRA Mistral-7B beat GPT-4 by ~10 pts avg across 31 narrow tasks.</p></div>
</div>`,
notes:`<b>第一幕的认知 payoff。注意:这是纯知识分享,对这屋子<u>没有</u>经济账</b> —— token 公司付、大家继续用 Opus 4.8,别把任何一页讲成"你该 fine-tune 省钱"。payoff 是<b>理解</b>,不是行动号召。<br>
"试个更好的 prompt 先"<b>不</b>放进表 —— 他们闭着眼都会。表讲的是 prompt <b>不是</b>答案的那些情况,而人们还在剩下两个里选错。<br>
<div class="t">为什么 fine-tuning 不该用来灌知识(讲仔细,会被怼):</div>
先<b>诚实地拆穿一个说法</b>:不是 fine-tuning <b>不能</b>改 fact —— full fine-tuning 改所有 weight,推够狠当然能改写。是它是<b>错的工具</b>,四个机制原因:<b>①</b> 信号 vs 固化:几条样本推不动上万次刻下的东西。<b>②</b> 推够狠就会 catastrophic forgetting + overfit 到措辞。<b>③</b> weight 是糟糕的数据库:不能改单条、删、审计来源、控权限。<b>④</b> 反直觉的一条:在模型本来不会的 fact 上微调,会教会它<b>自信地编</b> —— 学到的是"自信回答的形式",内容没可靠装进去。<span class="muted">出处:Gekhman et al., EMNLP 2024 (2405.05904) —— 新 fact 样本学得明显更慢,且一旦学进去会<b>线性</b>抬高幻觉率。</span><br>
<div class="t">为什么 RAG 反而对:</div>它根本不碰 weight,把 fact 放进 context 让模型<b>读</b>。阅读理解是被 pretraining 狂强化的可靠能力;"几条样本记住新 fact"是不可靠那部分。RAG 用可靠那半,把易变知识留在你能改/删/审计的数据里。<br>
<div class="t">"aha"(本页真正的爆点,是 insight 不是建议):</div>
<b>先显式消解矛盾(有人一定会问:既然不能注入知识,7B 凭什么微调后能打平大模型?):</b>不矛盾。fine-tuning 改的是模型<b>怎么用它已有的知识</b>(skill / behavior),不是它<b>拥有哪些知识</b>(facts)。两个 claim 各管一半 —— "不能注入"管的是 world facts(Paris),"能打平"管的是 task behavior。<span class="say">"7B 没学到新 fact,它学到的是把<b>已有</b>能力对准一个任务。知识没动(Slide 2),变的是 skill 的集中度。"</span><br>
那些垂直任务(分类、抽取、转格式、判别)考的根本不是"知不知道某个 fact",是"会不会按你的精确标准和格式做" —— 是 behavior。7B 在 pretraining 里<b>已经具备</b>底层能力,只是默认不按你要的方式输出;fine-tuning 把这个潜在能力<b>激发/对齐</b>出来(= Slide 3 的 reweight 已有分布),不是注入。<br>
<b>边界(必须讲,否则又过度承诺):</b>这只在任务落在 7B <b>已有能力范围内</b>、缺的只是对齐时成立。若任务真需要 7B pretraining 里<b>完全没有</b>的知识,fine-tuning 也救不了。<br>
<b>这正是 Gekhman 那篇的原话:</b>"factual knowledge is mostly acquired during pretraining; fine-tuning teaches the model to <b>use</b> it more efficiently" —— 同一篇论文同时撑起你的两个 claim。<br>
把 fine-tuning 看成<b>收窄分布</b>,市场现象就不奇怪了:机制是前沿模型把 capacity 摊在"什么都会"上,你那一个任务只用到一小片;fine-tune 小模型把它(更小的)capacity <b>全部</b>灌进这一个任务 —— 放弃做通才(别的全废)换成做专才。<br>
<b>scope 诚实(防过度承诺):</b>只对<b>窄、定义清晰</b>的任务成立(分类、抽字段、固定格式),不是开放推理。LoRA Land 正是<b>每任务一个专才</b>,不是一个模型通杀 GPT-4。<br>
<span class="say">presenter 钩子:"我以前也不信 7B 能跟前沿模型扳手腕 —— 直到你看清它不是在'什么都比',只是在一个被完全对准的任务上比。这就是为什么有些公司生产里上 fine-tuned 小模型,哪怕我们这屋子就只管调 Opus —— 不同的问题,不同的工具。"</span><br>
<span class="trans">→ 桥接第二幕:"假设你排除了 prompt 和 RAG,确实需要改 behavior,要 fine-tune 了。下一个问题才是真正挡住人的:我的机器跑得动吗?好消息 —— 这不是玄学,是乘法。"</span>`
},

/* 5 — parameter = one number */
{
body:`<div class="kicker"><span class="act">Act 2 — How much VRAM / what card?</span> · the unit</div>
<h2>A parameter is just <span class="em">one number</span></h2>
<div class="cols">
<div>
<p class="big">A neuron is linear regression.</p>
<pre>z = w1·x1 + w2·x2 + w3·x3 + w4·x4 + b</pre>
<table>
<tr><th>part</th><th>kind</th><th>count</th></tr>
<tr><td>w1..w4</td><td>weight</td><td>4</td></tr>
<tr><td>b</td><td>bias</td><td>1</td></tr>
<tr class="rowhi"><td><b>one neuron</b></td><td></td><td><b>5 params</b></td></tr>
</table>
</div>
<div>
<div class="card">
<p style="font-size:21px;margin:.2em 0">A <b>parameter</b> = one number (a weight or a bias).</p>
<p style="font-size:21px;margin:.5em 0">"8 billion parameters" = a bag of <b class="em">8 billion such numbers</b>, in matrices, stacked in layers.</p>
<p class="muted" style="font-size:18px;margin-top:10px">Everything in this act is just <b class="em2">count × bytes-each</b>.</p>
</div>
</div>
</div>`,
notes:`<b>第二幕第一步 —— 把 parameter 变具体,否则没法算 <code>count × bytes</code>。</b><br>
开场:<span class="say">"一个 neuron 就是线性回归。你写过 <code>y = w1·x1 + w2·x2 + b</code>,你就写过一个 neuron。"</span><br>
<div class="t">两个工程师真会想的问题:</div>
· <b>为什么要堆 layer,不就是一个大线性回归?</b>因为 layer 之间有<b>非线性函数</b>。没有它,堆叠的 linear layer 会塌缩:线性映射的复合还是线性,80 层等于 1 层,深度就没意义了。非线性才让深度能表示复杂函数 —— 这是 neuron 和 network 的区别。<br>
· <b>billions 从哪来?</b>weight 住在<b>矩阵</b>里。一个 4096→4096 的 layer 是 4096×4096 ≈ <b>1680 万</b>个数,就一个矩阵。堆 ~80 层、每层好几个这种矩阵 → billions。我们要乘的那个 count,就是所有这些矩阵的总大小。<br>
<span class="say">"里面没有魔法 —— 就是几百万个 <code>w·x+b</code>,你上学学的线性回归,堆深、层间加非线性。一旦它只是'一堆数的计数',显存就是张餐巾纸上的乘法。"</span><br>
<span class="trans">→ 转场:"那一个数花几个 byte?从最简单的开始 —— 你还没训练,只想<b>跑</b>这个模型。"</span>`
},

/* 6 — inference 2 bytes */
{
body:`<div class="kicker"><span class="act">Act 2</span> · just running it</div>
<h2>Inference: <span class="em">2 bytes</span> per parameter</h2>
<pre>memory to RUN  ≈  param_count <span class="hl2">× 2 bytes</span>     <span class="cmt">(bf16 = a 16-bit float)</span></pre>
<table>
<tr><th>model</th><th>inference memory (×2)</th></tr>
<tr><td>1B</td><td>2 GB</td></tr>
<tr><td>8B</td><td>16 GB</td></tr>
<tr class="rowhi"><td>70B</td><td><b>140 GB</b> — just to load</td></tr>
</table>
<div class="note-line">The model <span class="em">is</span> its parameters. Running it = one copy of them.</div>`,
notes:`<b>建立基线:跑一个模型 = 每个 parameter 一份拷贝。</b><br>
<div class="t">2 个 byte 里装的是什么 + 一个常被忘的成本:</div>
· <b>bf16 = 1 符号 + 8 指数 + 7 尾数位。</b>它保留 fp32 的<b>范围</b>(同样 8 个指数位,值不会溢出),但扔掉精度(7 尾数位 ≈ 2–3 位有效数字)。对 forward pass 足够 —— weight 只读一次,误差不跨 training step 累积,只在 layer 间流动(而且有 normalization)。所以 inference 用 2 byte 很开心。<br>
· <b>另一个 inference 成本:KV cache。</b>服务长 context 时,每个 token 缓存它的 key/value 向量省得重算 —— 它随 <code>batch × seq_len × layers × hidden</code> 增长,<b>与 param count 无关</b>。长对话里能跟模型本身一样大。(只提一句,让做 serving 的人知道 ×2 是地板不是全部。)<br>
<span class="say">"一个 70B 模型光加载就要 ~140 GB,啥都还没干。模型<b>就是</b>它的 parameter,跑它就是一份拷贝。训练每个 parameter 要更多 —— 下面这条值得背。"</span><br>
<span class="trans">→ 转场:"为什么训练比跑贵?因为对<b>每一个 parameter</b>,你现在存的不只是那个数。其实是多存三样。"</span>`
},

/* 7 — training 12 bytes (CORE) */
{
body:`<div class="kicker"><span class="act">Act 2</span> · the core slide</div>
<h2>Training: <span class="em">12 bytes</span> per parameter</h2>
<pre>per parameter, training keeps:
  (1) the value        <span class="hl">2</span>  bf16
  (2) its gradient     <span class="hl">2</span>  <span class="cmt">which way to nudge it</span>
  (3) optimizer  m     <span class="hl2">4</span>  fp32  <span class="cmt">momentum (avg of gradient)</span>
  (4) optimizer  v     <span class="hl2">4</span>  fp32  <span class="cmt">per-param adaptive step</span>
                     ────
                      <span class="hl">12</span>  →  param_count × 12</pre>
<div class="cols">
<div><table>
<tr><th>model</th><th>train ×12</th><th>infer ×2</th></tr>
<tr><td>1B</td><td><b>12 GB</b></td><td>2 GB</td></tr>
<tr><td>8B</td><td>96 GB</td><td>16 GB</td></tr>
<tr><td>70B</td><td><b class="em2">840 GB</b></td><td>140 GB</td></tr>
</table></div>
<div><div class="card"><p class="big" style="font-size:23px">Training ≈ 6× inference.</p>
<p style="font-size:19px;margin:.4em 0"><b>8 of the 12 bytes are optimizer state</b> — not the model.</p>
<p class="muted" style="font-size:17px">That's exactly what LoRA deletes next.</p></div></div>
</div>`,
notes:`<b>整场的核心页。慢慢讲。</b><br>
<div class="t">这四样到底是什么(别光报名字):</div>
· <b>gradient</b> = loss 对这一个 weight 的偏导:最能降低 error 的方向和大小。每步新算、用一次、扔掉。(用一次 → 2 byte 够。)<br>
· <b>m(一阶矩)</b> = gradient 的滑动平均 —— <b>momentum</b>。把逐步抖动的 gradient 抹平,训练不至于来回锯齿。<br>
· <b>v(二阶矩)</b> = gradient <b>平方</b>的滑动平均 —— 追踪这个 weight 的 gradient 一向多大,于是<b>每个 weight 有自己的步长</b>(gradient 又大又跳的走小步,稳的走大步)。这个<b>逐参数自适应步长</b>就是 Adam 比朴素 SGD 强的全部意义。<br>
· <b>为什么 optimizer state 占大头(6× 的来由):</b>(3)+(4) 是 12 字节里的 <b>8 字节</b> —— 训练显存三分之二是 optimizer 的滑动平均,不是模型。<b>这正是下一页 LoRA 要为 99% 的 param 删掉的东西。</b><br>
<span class="say">"这就是那一页。你现在能在下载任何东西<b>之前</b>就预测一个模型装不装得下。训练 ≈ param count × 12。模型本身是小头,optimizer state 才是吞显存的。"</span><br>
<b>可选深潜(只在有时间/被问时):</b>"m、v 为什么要 fp32(4 byte),weight 2 byte 就行?" → m、v 跨上千步<b>累加</b>;16-bit 下它们一大,每次微小更新就被舍入吃掉("大数吃小数":fp16 里 <code>1024+0.5=1024</code>),训练悄悄停滞。规则:<b>跨时间累加</b>的数要精度;<b>用一次就扔</b>的(gradient、activation)16-bit 够。一条规则解释整个 mixed-precision 布局。<b>主线上别主动讲,会糊掉干净的 ×12。</b><br>
<b>被问 fp32 master copy 时:</b>完整 mixed-precision 常还留一份 4-byte fp32 master weight → 16 byte/param 而非 12。我那次 1B 实测 ~13.84 GB,跟 12-byte 体制(+activations)一致,所以对我这次 12 是诚实的教学数;但若有人问,答"是,有些配置多 4 字节;我这次实测 ~12+activations,按你自己配置核对"。<br>
<span class="trans">→ 转场:"看 70B 那行:840 GB。没有单机有这个。那 70B fine-tuning 对我们就是没戏?不 —— 解法是你唯一还需要的一个概念。"</span>`
},

/* 8 — shrink: LoRA / QLoRA */
{
body:`<div class="kicker"><span class="act">Act 2</span> · shrink the multiplier</div>
<h2>Full → LoRA → QLoRA: drop the bytes/param</h2>
<table>
<tr><th>method</th><th>what trains</th><th>bytes/param</th><th>idea</th></tr>
<tr><td><b>Full</b></td><td>ALL parameters</td><td><b>~12</b></td><td>retrain everything</td></tr>
<tr><td><b class="em">LoRA</b></td><td>a ~1% added slice; freeze rest</td><td><b class="em">~2</b></td><td>only the slice gets gradient + optimizer</td></tr>
<tr class="rowhi"><td><b class="em">QLoRA</b></td><td>LoRA + 4-bit frozen base</td><td><b class="em">~0.6</b></td><td>also compress the frozen 99%</td></tr>
</table>
<pre>LoRA's bet: the <span class="hl">update</span> is low-rank.
  ΔW (4096×4096 = 16.8M)  ≈  B(4096×r) · A(r×4096)
  at r=16:  A+B = 131K numbers   <span class="cmt">≈ 0.8% of 16.8M</span>
Freeze W (2 B, no gradient/optimizer); train only A and B.</pre>
<div class="note-line">Why a 70B fine-tunes on a single 24–48 GB GPU.</div>`,
notes:`<b>奖励观众最多的一页 —— 它解释了"为什么单卡能 fine-tune 70B"。</b><br>
<div class="t">LoRA 到底怎么work:</div>
full fine-tuning 为每个 weight 矩阵 W 学一个<b>同样大</b>的 update ΔW —— 每个矩阵几百万个数。<br>
LoRA 的赌注:这个 <b>update 是低秩的</b> —— 能写成两个<b>瘦矩阵</b>的乘积,因为"移动 behavior 所需的调整"住在一个低维子空间里(你在<b>微调</b>,不是<b>重学</b>)。<br>
ΔW(1680 万个数)≈ B(4096×r)·A(r×4096);r=16 时,A+B 一共 <b>13.1 万</b>个数 ≈ 原来的 0.8%。<br>
你<b>冻结 W</b> —— 没 gradient、没 optimizer state,就 2 byte 摆在那 —— 只训练 A 和 B。于是 12-byte 的税只落在 ~1% 的 param 上,其余 99% 只花 2 byte。<b>平均 ≈ 2 byte/param。</b><br>
<div class="t">QLoRA 再进一步:</div>把冻结的 base 从 bf16(2 byte)压成 4-bit(NF4,0.5 byte),forward/backward 时即时解压;A/B adapter 保持 bf16。现在连冻结的 99% 都只花 0.5 byte → 平均 ≈ <b>0.6 byte/param</b>。<b>这就是为什么人们在单张 24–48 GB GPU 上 fine-tune 70B。</b><br>
<span class="say">"每次都是同一招 —— 不为你<b>不训练</b>的 parameter 付满 12 byte。slide 7 的算术没变,你只是在降 bytes-per-param,因为那个 update 原来是低秩的,所以你训两个小矩阵而不是整个。"</span><br>
<b>诚实:</b>full fine-tuning 我亲手做过(那次 1B)。这里 LoRA/QLoRA 的 bytes-per-param 是标准的每方法数值,还没亲测。(Friday 前拿 <code>a01-mem-budget/notes.md</code> 核对 0.6 / 2。)<br>
<span class="trans">→ 转场:"于是你有三个数 —— 12、2、0.6 byte/param。最后一步才是你真正想要的:哪个装得进你弄得到的卡?"</span>`
},

/* 9 — GPU table */
{
body:`<div class="kicker"><span class="act">Act 2</span> · what card do YOU need</div>
<h2>Map it to real GPUs</h2>
<table>
<tr><th>you have / rent</th><th>VRAM</th><th>can fine-tune</th><th>method</th></tr>
<tr><td>Consumer (RTX 4060/4070)</td><td>8–12 GB</td><td>0.5–1B full; up to ~7B</td><td>QLoRA</td></tr>
<tr class="rowhi"><td><b>RTX 4090 / 3090</b></td><td><b>24 GB</b></td><td>1–3B full; 7–13B; up to ~33B</td><td>LoRA/QLoRA</td></tr>
<tr><td>Rent 1× A100</td><td>40–80 GB</td><td>7B full; 13–34B; 70B</td><td>LoRA/QLoRA</td></tr>
<tr><td>Desktop box (my GX10)</td><td>128 GB</td><td>8B full; 70B</td><td>QLoRA</td></tr>
</table>
<pre>every cell = VRAM ÷ bytes_per_param   <span class="cmt">— derived, not memorized</span>
24 GB ÷ 12 (full)  → ~2B      24 GB ÷ 0.6 (QLoRA) → ~33B</pre>
<div class="note-line"><span class="em">16 GB gaming GPU</span> → 7B with QLoRA · or rent an A100 for <span class="em">~$1/hr</span>.</div>`,
notes:`<b>"什么卡"的字面答案 —— 而且每一格都是<b>推出来的</b>,不是查表。</b><br>
<div class="t">机制(让他们看到不用盲信表):</div>每格 = <code>max_param = VRAM ÷ bytes_per_param</code>。24 GB 卡,full(12)→ 24/12 = 2B → "1–3B full";同卡 QLoRA(0.6)→ 24/0.6 = 40B → 留 activation 余量后"~33B"。你不背这张表 —— 用 slide 7、8 的两个数<b>推</b>出任意一行。<br>
要点:<span class="say">"一张 16 GB 游戏卡,QLoRA 已经能 fine-tune 7B —— 你们很多人家里就有这卡。"</span><span class="say">"没有?RunPod / Lambda / Vast 上租张 A100 ~\$1–2/小时,一次小 fine-tune 几分钟 —— 一杯咖啡钱。"</span>整张表往下变的只有<b>方法</b>(full→LoRA→QLoRA),不是思路。<br>
<b>诚实标记(守住这条线):</b>唯一<b>实测</b>的数是 <b>1B full SFT = 13.84 GB(GX10)</b>。其余每格都是 param×bytes <b>估</b>出来的(跟社区广泛报告吻合),没亲测。被问"你测过 4090 那行?"→ <span class="say">"没。那是公式的预测。我唯一实测点是那次 1B,落在预测的 0.2% 内,所以我信这套算术。"</span>别把估算讲成实测。<br>
<span class="trans">→ 转场:"'我信这套算术'得有证据 —— 我刚才全是预测。真跑的时候,它对得上吗?"</span>`
},

/* 10 — proof */
{
body:`<div class="kicker"><span class="act">Act 2</span> · the proof</div>
<h2>Prediction vs reality</h2>
<pre>predicted (slide 7):  1B × 12 bytes   ≈  <span class="hl2">12 GB</span>
measured  (A2 run):                     <span class="hl">13.84 GB</span> peak</pre>
<div class="cols">
<div><div class="card">
<p style="font-size:21px;margin:.2em 0">The ~1.8 GB gap = <b class="em">activations</b> + framework overhead.</p>
<p style="font-size:19px;margin:.5em 0">Activations scale with <code>batch × seq × hidden × layers</code> — <b>not</b> param count. The workload term you control.</p>
</div></div>
<div><div class="card" style="border-color:#2a4a44">
<p class="big" style="font-size:24px">You don't <span class="em2">guess</span> whether a model fits.</p>
<p class="big" style="font-size:24px">You <span class="em">compute</span> it.</p>
<p class="muted" style="font-size:17px;margin-top:8px">×12 = the floor · activations on top.</p>
</div></div>
</div>`,
notes:`<b>诚实的收尾 —— 用唯一一个实测点验证整套算术。</b><br>
<div class="t">那 ~1.8 GB 的 gap 是什么:</div>×12 公式数的是 param+gradient+optimizer,它<b>故意略掉 activations</b> —— forward pass 中为了算 backward 而暂存的中间值。activations 随 <code>batch × seq_len × hidden × layers</code>,<b>不</b>随 param count —— 所以它是你用 batch size 和 gradient checkpointing 控制的<b>workload项</b>,不是固定的每-param 成本。再加几百 MB CUDA/框架开销。所以:<code>×12</code> 给你<b>地板</b>,activations 是上面浮动的部分。<br>
<span class="say">"跑之前公式说 ~12 GB。真实峰值 13.84 —— 多出的 ~1.8 是 activations 和开销,这部分你也能估。结论成立:我在<b>下载模型之前</b>就预测了它装不装得下,而它装下了。<b>这就是整场的承诺 —— 你不<u>猜</u>模型装不装得下,你<u>算</u></b>,先地板,再加 workload 项。"</span><br>
<span class="trans">→ 进收尾。</span>`
},

/* 11 — CLOSE */
{
body:`<div class="center">
<div class="kicker">Both walls are down</div>
<h1 style="font-size:40px">You don't guess. You compute.</h1>
<div style="text-align:left;max-width:850px;margin-top:8px">
<p style="font-size:21px;line-height:1.5"><b class="em2">Do I need it?</b> &nbsp;behavior → fine-tune · new facts → RAG · quick fix → prompt</p>
<p style="font-size:21px;line-height:1.5"><b class="em">What hardware?</b> &nbsp;<code>param × bytes</code> — full 12, LoRA 2, QLoRA 0.6 → match a card</p>
<p style="font-size:21px;line-height:1.5"><b>How?</b> &nbsp;<code>transformers</code> + <code>Trainer</code> · a public dataset · ~100 lines</p>
</div>
<div class="big" style="margin-top:22px">My run: Llama-3.2-1B · 500 examples · <span class="em">83 s</span> · <span class="em">13.84 GB</span>. Go try it.</div>
</div>`,
notes:`<b>收尾 —— 两堵墙都倒了,而且他们看到了<b>每个答案为什么对</b>,不只是结论。</b><br>
三句话复述:<br>
· <b>Blocker 1(需不需要):</b>fine-tuning <b>reweight behavior</b>,不<b>装 fact</b>(signal vs entrenchment)。style/format → fine-tune;新 fact → RAG;小修 → 先 prompt。<br>
· <b>Blocker 2(什么硬件):</b><code>param_count × bytes_per_param</code>。full 12、LoRA 2、QLoRA 0.6 —— 因为 update 低秩,你训 ~1% 冻结其余。配一张卡。16 GB 游戏卡或 \$1/小时 的 A100 就够。<br>
· <b>动手:</b>开源工具 —— HF <code>transformers</code>+<code>Trainer</code>、公开数据集、Docker、~100 行。<br>
<span class="say">收尾句:"最难、最贵的那部分 —— pretraining —— 已经替你做好了。剩下的是你能预测的算术、能推理的机制,跑在你已经拥有、或一杯咖啡钱能租到的硬件上。去试。"</span>`
}

];

/* ============================================================
   engine
   ============================================================ */
const stage=document.getElementById('stage');
const nbody=document.getElementById('nbody');
const hud=document.getElementById('hud');
const bar=document.getElementById('bar');
const NOTES=slides.map(s=>s.notes||'<span class="muted">（无讲稿）</span>');
let i=0, presenterWin=null;
// build
slides.forEach((s,idx)=>{
  const d=document.createElement('div');
  d.className='slide'+(idx===0?' active':'');
  d.innerHTML=s.body;
  stage.appendChild(d);
});
const els=[...document.querySelectorAll('.slide')];
function render(){
  els.forEach((e,idx)=>e.classList.toggle('active',idx===i));
  nbody.innerHTML=NOTES[i];
  hud.textContent=`${i+1} / ${slides.length}`;
  bar.style.width=((i)/(slides.length-1)*100)+'%';
  document.getElementById('notes').scrollTop=0;
  pushPresenter();
}
function go(n){i=Math.max(0,Math.min(slides.length-1,n));render();}
window.deckNav=(d)=>go(i+d);   // called by the presenter window

/* ---------- presenter window (second screen, same-origin via blank open) ---------- */

<title>讲稿 · Presenter view</title><style>
 body{margin:0;background:#070b18;color:#e8eefc;height:100vh;display:flex;flex-direction:column;
   font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}

   background:#0d1430;border-bottom:2px solid #5eead4}
 #pg{font-size:22px;font-weight:800;color:#5eead4}
 #clock{font-size:24px;font-weight:700;color:#fbbf24;font-variant-numeric:tabular-nums;cursor:pointer}
 #cur{flex:1;overflow:auto;padding:22px 28px;font-size:21px;line-height:1.72}
 #cur b{color:#fff} .t{color:#5eead4} .say{color:#ffd98a} .trans{color:#8fe3d4;font-style:italic}
 #cur code{background:#11193a;padding:1px 6px;border-radius:5px;color:#bfe;font-size:15px}
 #nxtwrap{border-top:1px solid #24304f;padding:12px 28px;max-height:27vh;overflow:auto;background:#0a1020}
 #nxtwrap h4{margin:0 0 6px;font-size:13px;letter-spacing:.1em;color:#9fb0d6;text-transform:uppercase}
 #nxt{font-size:15.5px;line-height:1.5;color:#9fb0d6} #nxt b{color:#cdd9f5}
 #nxt code{background:#11193a;padding:1px 5px;border-radius:5px;color:#bfe;font-size:14px}
 #hint{padding:6px 22px;font-size:12px;color:#5b6a93;background:#0d1430}
</style></head><body>
 <div id="top"><div id="pg">– / –</div><div id="clock" title="点击或按 R 重置">00:00</div></div>
 <div id="cur" style="opacity:.5">等待主窗口同步…（在任一窗口按 → 翻页）</div>
 <div id="nxtwrap"><h4>下一页 Next ▸</h4><div id="nxt"></div></div>
 <div id="hint">← → 翻页（与主窗口同步） · R 重置计时 · 把此窗口拖到你的笔记本屏，投影只放主窗口</div>
<script>
 var t0=Date.now();
 function reset(){t0=Date.now();}
 setInterval(function(){
   var s=Math.floor((Date.now()-t0)/1000);
   var m=String(Math.floor(s/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
   var c=document.getElementById('clock'); if(c)c.textContent=m+':'+ss;
 },500);
 document.getElementById('clock').addEventListener('click',reset);
 addEventListener('keydown',function(ev){
   if(ev.key==='ArrowRight'||ev.key===' '||ev.key==='PageDown'){if(window.opener&&!opener.closed)opener.deckNav(1);ev.preventDefault();}
   else if(ev.key==='ArrowLeft'||ev.key==='PageUp'){if(window.opener&&!opener.closed)opener.deckNav(-1);ev.preventDefault();}
   else if(ev.key==='r'||ev.key==='R'){reset();}
 });
<\/script></body></html>`;

function openPresenter(){
  if(presenterWin && !presenterWin.closed){ presenterWin.focus(); return; }
  presenterWin=window.open('','deckPresenter','width=780,height=880');
  if(!presenterWin){ alert('弹窗被浏览器拦截——请允许本页弹窗后再按 P'); return; }
  document.body.classList.remove('notes-on');  // notes move to the popup; keep the projected page clean
  presenterWin.document.open();
  presenterWin.document.write(PRESENTER_DOC);
  presenterWin.document.close();
  setTimeout(pushPresenter,80);
}
function pushPresenter(){
  if(!presenterWin || presenterWin.closed) return;
  try{
    const doc=presenterWin.document;
    const pg=doc.getElementById('pg'); if(!pg) return;   // not yet written
    pg.textContent=(i+1)+' / '+slides.length;
    const cur=doc.getElementById('cur'); cur.style.opacity='1'; cur.innerHTML=NOTES[i]; cur.scrollTop=0;
    doc.getElementById('nxt').innerHTML=(i+1<slides.length?NOTES[i+1]:'<span style="opacity:.4">— 结束 —</span>');
  }catch(e){/* window closing */}
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(i+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1);e.preventDefault();}
  else if(e.key==='Home'){go(0);}
  else if(e.key==='End'){go(slides.length-1);}
  else if(e.key==='n'||e.key==='N'){
    if(presenterWin && !presenterWin.closed){ presenterWin.focus(); }  // notes are in the popup; don't mirror onto the projected page
    else { document.body.classList.toggle('notes-on'); render(); }
  }
  else if(e.key==='p'||e.key==='P'){openPresenter();}
  else if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
// click right half = next, left = prev
stage.addEventListener('click',e=>{
  const x=e.clientX/window.innerWidth;
  go(x>0.5?i+1:i-1);
});
window.addEventListener('beforeunload',()=>{ if(presenterWin&&!presenterWin.closed)presenterWin.close(); });
render();
</script>
</body>
</html>
